# This workflow will run golangci-unit using the config file present in the repository

name: golangci-lint run

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
    CI: true

jobs:
    golangci-lint_run:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-go@v6
          with:
            go-version: '1.24'
        - uses: golangci/golangci-lint-action@v9
          with:
            version: v2.8.0
